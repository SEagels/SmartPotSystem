[project]
name = "smartpot-backend"
version = "1.0.0"
description = "Smart Plant Pot System - Cloud Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.1",
    "pydantic-settings>=2.7.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "redis[hiredis]>=5.2.1",
    "paho-mqtt>=2.1.0",
    "python-multipart>=0.0.18",
    "boto3>=1.36.0",
    "httpx>=0.28.1",
    "Pillow>=11.0.0",
    "ultralytics>=8.3.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
